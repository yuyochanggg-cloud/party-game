<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尾牙大亂鬥 - 總控台 (多題庫版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 text-white min-h-screen p-6 font-sans">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <div class="bg-gray-900 p-6 rounded-2xl border-2 border-gray-700 shadow-2xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-2">🚦 遊戲主控台</h2>
                <div id="status-indicator" class="flex items-center space-x-2 text-gray-400">
                    <span class="w-3 h-3 rounded-full bg-gray-500"></span>
                    <span>目前狀態：讀取中...</span>
                </div>
            </div>
            
            <div class="flex space-x-4">
                <button id="btn-reset-game" class="group relative px-6 py-3 font-bold text-white rounded-xl bg-gray-700 hover:bg-red-600 transition-all duration-300 shadow-lg border border-gray-600">
                    <span class="mr-2">⏹</span> 重置/暫停
                    <div class="absolute -bottom-10 left-1/2 transform -translate-x-1/2 text-xs bg-black text-white px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap pointer-events-none">
                        讓玩家回到等待畫面
                    </div>
                </button>

                <button id="btn-start-game" class="relative px-8 py-3 font-black text-black rounded-xl bg-gradient-to-r from-green-400 to-green-600 hover:from-green-300 hover:to-green-500 transform hover:scale-105 transition-all duration-200 shadow-[0_0_20px_rgba(74,222,128,0.5)] border-2 border-green-300">
                    <span class="mr-2 text-xl">▶️</span> 立即開始
                </button>
            </div>
        </div>

        <div class="flex space-x-2 border-b border-gray-700 pb-1">
            <button onclick="switchTab('rank')" id="tab-rank" class="px-6 py-3 bg-yellow-500 text-black font-bold rounded-t-lg transition hover:bg-yellow-400 shadow z-10 relative">📊 即時排行榜</button>
            <button onclick="switchTab('settings')" id="tab-settings" class="px-6 py-3 bg-gray-800 text-gray-400 font-bold rounded-t-lg border-b border-gray-700 hover:bg-gray-700 transition">⚙️ 題庫設定</button>
        </div>

        <div id="view-rank" class="block bg-gray-900 p-6 rounded-b-xl rounded-tr-xl shadow-xl min-h-[500px]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">🏆 戰況總覽</h2>
                <button id="btn-clear-rank" class="text-sm bg-red-900/50 text-red-200 px-4 py-2 rounded hover:bg-red-800 border border-red-800 transition">⚠️ 清空所有玩家資料</button>
            </div>
            <div class="bg-gray-800 rounded-xl overflow-hidden shadow-inner border border-gray-700">
                <table class="w-full text-left">
                    <thead class="bg-gray-950 text-gray-400 uppercase text-sm tracking-wider">
                        <tr>
                            <th class="p-4">名次</th>
                            <th class="p-4">姓名</th>
                            <th class="p-4">部門</th>
                            <th class="p-4">準確率</th>
                            <th class="p-4">Max Combo</th>
                            <th class="p-4 text-right">總分</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-gray-700 text-lg">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="view-settings" class="hidden bg-gray-900 p-6 rounded-b-xl rounded-tr-xl shadow-xl min-h-[500px]">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 sticky top-0 bg-gray-900 z-20 py-4 border-b border-gray-800 gap-4">
                
                <div class="flex items-center space-x-2 w-full md:w-auto">
                    <span class="text-gray-400">📂 編輯題庫：</span>
                    <select id="quiz-set-select" class="bg-gray-800 text-white border border-gray-600 rounded p-2 flex-grow outline-none focus:border-yellow-400">
                        <option value="" disabled selected>載入中...</option>
                    </select>
                    <button id="btn-create-set" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded text-sm whitespace-nowrap">+ 新卷</button>
                    <button id="btn-delete-set" class="bg-red-900/50 hover:bg-red-800 text-red-200 px-3 py-2 rounded text-sm whitespace-nowrap">刪除</button>
                </div>

                <div class="flex space-x-2 w-full md:w-auto justify-end">
                    <button id="btn-set-active" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 px-4 rounded shadow-lg text-sm transition border border-yellow-400">
                        🌟 設為本次比賽題庫
                    </button>
                    <button id="btn-save-questions" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded shadow-lg text-sm transition transform hover:scale-105">
                        💾 儲存修改
                    </button>
                </div>
            </div>

            <div id="questions-container" class="space-y-8 pb-10">
                <p class="text-gray-400 text-center py-10 animate-pulse">正在讀取雲端題庫...</p>
            </div>

            <button id="btn-add-question" class="w-full py-4 border-2 border-dashed border-gray-700 text-gray-500 hover:text-white hover:border-gray-500 rounded-xl transition font-bold text-xl mb-10">
                + 新增一題 (Add Question)
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, getDocs, deleteDoc, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDkQV-3otX0Kber9gIcyom8aTfpnuJvbDk",
            authDomain: "ls3cquiz.firebaseapp.com",
            projectId: "ls3cquiz",
            storageBucket: "ls3cquiz.firebasestorage.app",
            messagingSenderId: "297051924336",
            appId: "1:297051924336:web:4a601199a2f37611d311b5",
            measurementId: "G-FV1YCGQNYB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 全域變數
        let currentQuizId = "default_set"; 
        let questionsCache = [];

        // ----------------------------------------------------
        // 1. 遊戲狀態控制
        // ----------------------------------------------------
        const statusDiv = document.getElementById('status-indicator');
        
        onSnapshot(doc(db, "game_state", "control"), (docSnap) => {
            const data = docSnap.data();
            const status = data?.status || 'waiting';
            const activeId = data?.activeQuizId || '尚未設定';
            
            if(status === 'started') {
                statusDiv.innerHTML = `<span class="w-3 h-3 rounded-full bg-green-500 animate-ping"></span><span class="text-green-400 font-bold ml-2">🔥 遊戲進行中 (卷: ${activeId})</span>`;
            } else {
                statusDiv.innerHTML = `<span class="w-3 h-3 rounded-full bg-yellow-500"></span><span class="text-yellow-400 font-bold ml-2">⏸ 等待開始 (卷: ${activeId})</span>`;
            }
        });

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            if(!confirm("確定要開始遊戲嗎？")) return;
            await setDoc(doc(db, "game_state", "control"), { status: 'started', timestamp: serverTimestamp() }, { merge: true });
        });

        document.getElementById('btn-reset-game').addEventListener('click', async () => {
            if(!confirm("⚠️ 警告：確定要重置嗎？\n這會強制把所有正在玩的玩家踢回「準備畫面」。")) return;
            await setDoc(doc(db, "game_state", "control"), { status: 'waiting', timestamp: serverTimestamp() }, { merge: true });
        });

        // ----------------------------------------------------
        // 2. 排行榜邏輯
        // ----------------------------------------------------
        const q = query(collection(db, "players"), orderBy("score", "desc"));
        let latestDocs = [];
        let needsUpdate = false;

        onSnapshot(q, (snapshot) => {
            latestDocs = snapshot.docs;
            needsUpdate = true;
        });

        setInterval(() => {
            if (needsUpdate) {
                renderLeaderboard(latestDocs);
                needsUpdate = false;
            }
        }, 1000);

        function renderLeaderboard(docs) {
            const tbody = document.getElementById('leaderboard-body');
            let htmlContent = "";
            let rank = 1;

            docs.forEach((docSnap) => {
                const p = docSnap.data();
                let rankDisplay = `<span class="font-mono text-gray-500">#${rank}</span>`;
                let rowClass = "";
                if (rank === 1) { rankDisplay = "🥇"; rowClass = "text-yellow-400 bg-yellow-900/10"; }
                if (rank === 2) { rankDisplay = "🥈"; rowClass = "text-gray-300"; }
                if (rank === 3) { rankDisplay = "🥉"; rowClass = "text-orange-400"; }

                htmlContent += `
                    <tr class="hover:bg-gray-800 transition border-b border-gray-700">
                        <td class="p-4 text-2xl">${rankDisplay}</td>
                        <td class="p-4 font-bold text-lg ${rowClass}">${p.name || '---'}</td>
                        <td class="p-4 text-gray-400">${p.org || '---'}</td>
                        <td class="p-4 font-mono text-blue-300">${p.accuracy ? p.accuracy + '%' : '-'}</td>
                        <td class="p-4 font-mono text-orange-400 font-bold">${p.maxCombo ? 'x' + p.maxCombo : '-'}</td>
                        <td class="p-4 text-right font-mono text-2xl font-black ${rank === 1 ? 'text-yellow-400' : 'text-white'}">${p.score?.toLocaleString() || 0}</td>
                    </tr>
                `;
                rank++;
            });
            tbody.innerHTML = htmlContent;
        }

        document.getElementById('btn-clear-rank').addEventListener('click', async () => {
            if (!confirm("🧨 危險操作：確定要刪除所有玩家紀錄嗎？\n排行榜將會清空！")) return;
            const snapshot = await getDocs(collection(db, "players"));
            snapshot.forEach(async (d) => await deleteDoc(doc(db, "players", d.id)));
        });

        // ----------------------------------------------------
        // 3. 多題庫管理系統
        // ----------------------------------------------------

        // A. 讀取題庫列表
        async function loadQuizList() {
            const select = document.getElementById('quiz-set-select');
            select.innerHTML = '<option value="" disabled>讀取中...</option>';
            
            const snapshot = await getDocs(collection(db, "quiz_sets"));
            select.innerHTML = '';
            
            if (snapshot.empty) {
                await createNewSet("預設題庫 A");
                return; 
            }

            snapshot.forEach(doc => {
                const opt = document.createElement('option');
                opt.value = doc.id;
                opt.text = doc.id;
                select.appendChild(opt);
            });

            // 保持選擇狀態
            if (!currentQuizId || !Array.from(select.options).some(o => o.value === currentQuizId)) {
                currentQuizId = select.options[0].value;
            }
            select.value = currentQuizId;
            loadQuestionsForSet(currentQuizId);
        }

        // B. 讀取特定題庫的題目
        async function loadQuestionsForSet(setId) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '<p class="text-center text-gray-500 py-10">載入題目中...</p>';
            
            try {
                const docSnap = await getDoc(doc(db, "quiz_sets", setId));
                if (docSnap.exists()) {
                    questionsCache = docSnap.data().questions || [];
                } else {
                    questionsCache = [];
                }
                renderQuestionsForm();
            } catch (e) {
                console.error(e);
                alert("讀取題目失敗");
            }
        }

        // C. 渲染題目編輯表單
        function renderQuestionsForm() {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            if (questionsCache.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-600">目前沒有題目，請點擊下方新增。</p>';
                return;
            }

            questionsCache.forEach((qData, index) => {
                const div = document.createElement('div');
                div.className = "bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md relative group hover:border-blue-500 transition";
                div.innerHTML = `
                    <div class="absolute right-4 top-4 text-gray-500 cursor-pointer hover:text-red-500 z-10" onclick="removeQuestion(${index})">🗑️ 刪除此題</div>
                    <div class="flex justify-between mb-4 pr-20">
                        <label class="font-bold text-xl text-yellow-400">Q${index + 1}</label>
                        <div class="flex items-center space-x-2">
                            <label class="text-xs text-gray-400">秒數</label>
                            <input type="number" data-idx="${index}" class="input-time w-16 p-1 bg-gray-900 border border-gray-600 rounded text-center text-white" value="${qData.timeLimit || 20}" min="5" max="60">
                        </div>
                    </div>
                    <input type="text" data-idx="${index}" class="input-q w-full p-3 mb-6 bg-gray-900 border border-gray-600 focus:border-blue-400 rounded-lg text-white text-lg font-bold placeholder-gray-600" placeholder="請輸入題目內容..." value="${qData.q || ''}">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${[0, 1, 2, 3].map((optIdx) => `
                            <div class="flex items-center space-x-3 bg-gray-900/50 p-3 rounded-lg border border-gray-700 hover:bg-gray-900 transition">
                                <input type="radio" name="ans-${index}" value="${optIdx}" ${qData.ans == optIdx ? 'checked' : ''} class="input-ans w-6 h-6 accent-green-500 cursor-pointer">
                                <span class="font-mono text-gray-500 font-bold">${String.fromCharCode(65+optIdx)}.</span>
                                <input type="text" data-idx="${index}" data-opt="${optIdx}" class="input-opt w-full p-2 bg-transparent border-b border-gray-600 focus:border-yellow-400 outline-none text-white transition" placeholder="選項 ${String.fromCharCode(65+optIdx)}" value="${qData.options[optIdx] || ''}">
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // D. 刪除單一題目 (掛載到 window)
        window.removeQuestion = (index) => {
            if(!confirm("確定刪除第 " + (index+1) + " 題嗎？")) return;
            saveCurrentFormToCache();
            questionsCache.splice(index, 1);
            renderQuestionsForm();
        };

        // E. 暫存表單資料
        function saveCurrentFormToCache() {
            const container = document.getElementById('questions-container');
            const questionDivs = container.children;
            
            // 如果顯示的是"沒有題目"的文字，就跳過
            if (questionsCache.length === 0 && container.innerText.includes("沒有題目")) return;

            questionsCache = Array.from(questionDivs).map((div, index) => {
                const qInput = div.querySelector('.input-q');
                if (!qInput) return null; // 防呆

                const timeInput = parseInt(div.querySelector('.input-time').value) || 20;
                const options = [
                    div.querySelector('[data-opt="0"]').value,
                    div.querySelector('[data-opt="1"]').value,
                    div.querySelector('[data-opt="2"]').value,
                    div.querySelector('[data-opt="3"]').value
                ];
                const ansRadio = div.querySelector(`input[name="ans-${index}"]:checked`);
                const ans = ansRadio ? parseInt(ansRadio.value) : 0;
                
                return { q: qInput.value, options, ans, timeLimit: timeInput };
            }).filter(item => item !== null);
        }

        // F. 建立新題庫
        document.getElementById('btn-create-set').addEventListener('click', async () => {
            const name = prompt("請輸入新考卷名稱 (例如: 決賽題庫):", "新題庫");
            if (!name) return;
            await createNewSet(name);
        });

        async function createNewSet(name) {
            try {
                // 檢查是否已存在
                const docRef = doc(db, "quiz_sets", name);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    if(!confirm("此題庫名稱已存在，要覆蓋嗎？")) return;
                }

                await setDoc(docRef, { 
                    questions: [{ q: "範例題目...", options: ["A","B","C","D"], ans: 0, timeLimit: 20 }],
                    createdAt: serverTimestamp()
                });
                currentQuizId = name;
                loadQuizList();
            } catch(e) { console.error(e); alert("建立失敗"); }
        }

        // G. 切換題庫
        document.getElementById('quiz-set-select').addEventListener('change', (e) => {
            currentQuizId = e.target.value;
            loadQuestionsForSet(currentQuizId);
        });

        // H. 新增題目
        document.getElementById('btn-add-question').addEventListener('click', () => {
            saveCurrentFormToCache();
            questionsCache.push({ q: "", options: ["","","",""], ans: 0, timeLimit: 20 });
            renderQuestionsForm();
            // 捲動到底部
            setTimeout(() => {
                const container = document.getElementById('questions-container');
                if(container.lastElementChild) container.lastElementChild.scrollIntoView({ behavior: "smooth" });
            }, 100);
        });

        // I. 儲存
        document.getElementById('btn-save-questions').addEventListener('click', async () => {
            saveCurrentFormToCache();
            if (!currentQuizId) return alert("錯誤：沒有選擇題庫");

            try {
                await setDoc(doc(db, "quiz_sets", currentQuizId), { questions: questionsCache }, { merge: true });
                alert(`✅ 題庫「${currentQuizId}」儲存成功！\n\n⚠️ 重要：請記得按「🌟 設為本次比賽題庫」，玩家才會讀取到這一份喔！`);
            } catch (e) { console.error(e); alert("儲存失敗"); }
        });

        // J. 設為活動題庫 (關鍵功能)
        document.getElementById('btn-set-active').addEventListener('click', async () => {
            if (!currentQuizId) return;
            
            // 讀取現在狀態確認
            const qCount = questionsCache.length;
            if (qCount === 0) return alert("這個題庫沒有題目，不能設定為活動題庫！");

            if (!confirm(`確定要將「${currentQuizId}」(${qCount}題) 設為本次比賽用的考卷嗎？\n\n所有新加入的玩家都會讀取這一份。`)) return;

            try {
                await setDoc(doc(db, "game_state", "control"), { 
                    activeQuizId: currentQuizId,
                    status: 'waiting' // 重置狀態為等待，避免直接開始
                }, { merge: true });
                
                alert(`🎉 設定完成！\n目前活動題庫：${currentQuizId}`);
            } catch(e) { console.error(e); alert("設定失敗"); }
        });

        // K. 刪除題庫
        document.getElementById('btn-delete-set').addEventListener('click', async () => {
            if (!currentQuizId) return;
            if (!confirm(`⚠️ 警告：確定要永久刪除「${currentQuizId}」嗎？無法復原！`)) return;
            
            try {
                await deleteDoc(doc(db, "quiz_sets", currentQuizId));
                alert("已刪除");
                currentQuizId = null;
                loadQuizList();
            } catch(e) { console.error(e); alert("刪除失敗"); }
        });

        // L. 分頁切換
        window.switchTab = (tabName) => {
            if (tabName === 'rank') {
                document.getElementById('view-rank').classList.remove('hidden');
                document.getElementById('view-settings').classList.add('hidden');
                document.getElementById('tab-rank').className = "px-6 py-3 bg-yellow-500 text-black font-bold rounded-t-lg shadow z-10 relative";
                document.getElementById('tab-settings').className = "px-6 py-3 bg-gray-800 text-gray-400 font-bold rounded-t-lg border-b border-gray-700 hover:bg-gray-700 transition";
            } else {
                document.getElementById('view-rank').classList.add('hidden');
                document.getElementById('view-settings').classList.remove('hidden');
                document.getElementById('tab-rank').className = "px-6 py-3 bg-gray-800 text-gray-400 font-bold rounded-t-lg border-b border-gray-700 hover:bg-gray-700 transition";
                document.getElementById('tab-settings').className = "px-6 py-3 bg-blue-600 text-white font-bold rounded-t-lg shadow z-10 relative";
                
                // 進入設定頁時載入列表
                loadQuizList();
            }
        };
    </script>
</body>
</html>
